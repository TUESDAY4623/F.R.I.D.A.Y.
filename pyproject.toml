[project]
name = "jarvis-contracts"
version = "0.1.0"
description = "Core data contracts for the Jarvis agentic desktop AI system"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pydantic-models]
# Used by schema generation script
