name: Tests

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync

      - name: Run backend tests
        run: uv run pytest -v --ignore=tests/test_ui.py --ignore=tests/test_phase2_ui.py

  ui-tests:
    runs-on: ubuntu-latest

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libegl-mesa0 \
            libgl1 \
            libglx0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libfontconfig1

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync

      - name: Run UI tests
        run: uv run pytest -v tests/test_ui.py tests/test_phase2_ui.py